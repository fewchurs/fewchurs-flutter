name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  default-url:
    # Fails if FewchursClient.defaultBaseUrl stops resolving, so a dead domain
    # can't ship again. Any HTTP answer below 500 counts (401 without a key).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          url=$(sed -n "s/.*defaultBaseUrl = '\(.*\)';/\1/p" packages/fewchurs_core/lib/src/client.dart)
          test -n "$url" || { echo "defaultBaseUrl not found"; exit 1; }
          http_status=$(curl -s -o /dev/null -w '%{http_code}' --retry 3 --retry-all-errors -m 20 "$url/config" || true)
          echo "$url/config -> HTTP $http_status"
          [ "$http_status" -ge 200 ] && [ "$http_status" -lt 500 ]

  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        sdk: ['3.0.0', stable]
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ matrix.sdk }}
      - working-directory: packages/fewchurs_core
        run: |
          dart pub get
          dart analyze --fatal-warnings
          dart test

  flutter:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        flutter: ['3.10.6', stable]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.flutter == 'stable' && '' || matrix.flutter }}
          channel: stable
      - working-directory: packages/fewchurs
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test
      - working-directory: packages/fewchurs/example
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos
