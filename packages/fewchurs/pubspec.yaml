name: fewchurs
description: A plug-and-play feature-request board for Flutter. List, vote, comment, follow and submit ideas, themed to match your app on every platform.
version: 1.2.0
homepage: https://www.fewchurs.shop
repository: https://github.com/fewchurs/fewchurs-flutter
topics: [feedback, feature-requests, voting]

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  fewchurs_core: ^1.1.0
  http: '>=1.0.0 <2.0.0'
  shared_preferences: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: '>=2.0.0 <7.0.0'

flutter:
